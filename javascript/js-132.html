<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Browser: setInterval</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;line-height:1.6}.container{max-width:1100px;margin:30px auto;padding:20px}.card,.demo{background:white;border-radius:14px;padding:24px;margin:18px 0;box-shadow:0 6px 20px rgba(0,0,0,.08)}h1{margin-bottom:8px}.nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.nav a,button{background:#172033;color:white;border:0;border-radius:8px;padding:10px 15px;text-decoration:none;cursor:pointer}input,select,textarea{padding:10px;border:1px solid #ccd3df;border-radius:7px;margin:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #aaa;padding:9px;text-align:left}.output{margin-top:12px;padding:12px;background:#eef3fa;border-radius:8px}@media(max-width:600px){.container{padding:12px}.nav{flex-direction:column}}.dark{background:#111827;color:#f9fafb}.dark .demo,.dark .card{background:#1f2937}</style></head><body><main class="container"><nav class="nav"><a href="../index.html">Home</a><a href="index.html">Back to Programs</a></nav><section class="card"><h1>Browser: setInterval</h1><p>JavaScript practical demonstration from the assignment list.</p></section><section class="demo"><button onclick='run()'>Start Counter</button><div id='out' class='output'>0</div></section></main><script>let n=0;function run(){setInterval(()=>out.textContent=++n,1000)}</script></body></html>
